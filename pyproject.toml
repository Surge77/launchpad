[project]
name = "launchpad"
version = "0.1.0"
description = "Terminal project launcher — pick a repo, get its whole dev environment running in one keystroke."
requires-python = ">=3.11"
dependencies = [
    "textual==0.86.3",
    "psutil==6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pyright==1.1.391",
]

[project.scripts]
launch = "launchpad.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
