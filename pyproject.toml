[project]
name = "launchpad"
version = "0.1.0"
description = "Terminal project launcher — pick a repo, get its whole dev environment running in one keystroke."
requires-python = ">=3.11"
dependencies = [
    "textual==0.86.3",
    "psutil==6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==6.0.0",
    "pytest-asyncio==0.24.0",
    "pyright==1.1.391",
]

[project.scripts]
launch = "launchpad.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
